{{/*
  Two Services so the Ingress can route by path to the right port. Both select the same Pod —
  the split is about ports, not about scheduling.

  The backend-config annotation binds each Service to its BackendConfig (see backendconfig.yaml),
  which fixes the Google Cloud health check path. "default" applies the BackendConfig to every
  port of the Service; the per-port form is unnecessary here, each Service exposes one port. The
  annotation is inert on any non-GKE ingress controller — it is the BackendConfig object itself
  that only exists on GKE, which is why both are behind ingress.backendConfig.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: consiva-app
  {{- if and .Values.ingress.enabled .Values.ingress.backendConfig }}
  annotations:
    cloud.google.com/backend-config: '{"default": "{{ .Values.name }}-frontend"}'
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: consiva-app
  ports:
    - name: http-web
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: consiva-app
  {{- if and .Values.ingress.enabled .Values.ingress.backendConfig }}
  annotations:
    cloud.google.com/backend-config: '{"default": "{{ .Values.name }}-backend"}'
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: consiva-app
  ports:
    - name: http-api
      port: 80
      targetPort: 5000
